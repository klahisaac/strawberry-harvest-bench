[project]
name = "strawberry-harvest"
version = "0.2.0"
description = "A strawberry-harvesting robot demo: a field failure rebuilt in simulation and fixed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "numpy",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
    "ultralytics>=8.4.215",
]

[dependency-groups]
demo = [
    "imageio-ffmpeg>=0.8.1",
]
dev = ["pytest"]

[tool.uv]
# Scripts, not an installable package.
package = false
