[project]
name = "harvestbench"
version = "0.1.0"
description = "Simulation-first bench for an autonomous strawberry-harvesting robot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "numpy",
    "scipy>=1.18.1",
]

[project.scripts]
harvest = "harvestbench.cli:main"

[dependency-groups]
demo = [
    "imageio-ffmpeg>=0.8.1",
]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harvestbench"]

[tool.uv]
# The demo group carries the video encoder for the demo page; installed by
# default so `uv sync` is all a fresh checkout needs.
default-groups = ["dev", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
